<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DSA 100 — LeetCode Roadmap | C++ & Java</title>
<meta name="description" content="100 LeetCode problems organized by topic — Arrays, Strings, Linked List, Stack/Queue, Trees, Graphs, DP. Track your progress with clickable LeetCode links."/>
<meta name="theme-color" content="#ffffff"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── Reset ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Variables (Clean Light Theme) ─────────────────────────── */
:root{
  --bg:#f8fafc;
  --sur:#ffffff;
  --elv:#f1f5f9;
  --brd:#e2e8f0;
  --brd2:#f1f5f9;
  --t1:#0f172a;
  --t2:#475569;
  --t3:#64748b;
  --lnk:#2563eb;
  --lnkh:#1d4ed8;
  --acc:#2563eb;
  --e:#15803d;  --eb:#f0fdf4;  --ebo:#bbf7d0;
  --m:#b45309;  --mb:#fffbeb;  --mbo:#fde68a;
  --h:#b91c1c;  --hb:#fef2f2;  --hbo:#fca5a5;
  --r:6px;
  --rs:4px;
  --shd:0 1px 3px 0 rgba(0,0,0,0.05),0 1px 2px -1px rgba(0,0,0,0.05);
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}

/* ── Base ───────────────────────────────────────────────────── */
html{scroll-behavior:smooth;scroll-padding-top:168px}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:var(--sans)}

/* ── Sticky wrapper ─────────────────────────────────────────── */
.sticky{position:sticky;top:0;z-index:50;background:var(--sur);border-bottom:1px solid var(--brd);box-shadow:var(--shd)}

/* ── Header ─────────────────────────────────────────────────── */
.hd{border-bottom:1px solid var(--brd2)}
.hd-in{max-width:960px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hd-title{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--t1)}
.hd-sub{font-size:12px;color:var(--t3);margin-top:2px}
.hd-r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px}

/* Stats chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--rs);border:1px solid var(--brd);background:var(--elv);color:var(--t2);white-space:nowrap}
.chip.tot{color:var(--t1);background:var(--sur);border-color:var(--brd)}
.chip.e{color:var(--e);background:var(--eb);border-color:var(--ebo)}
.chip.m{color:var(--m);background:var(--mb);border-color:var(--mbo)}
.chip.h{color:var(--h);background:var(--hb);border-color:var(--hbo)}

/* Progress row */
.prog{display:flex;align-items:center;gap:8px}
.prog-lbl{font-size:12px;color:var(--t2);white-space:nowrap}
.prog-lbl strong{color:var(--t1)}
.prog-track{width:110px;height:6px;background:var(--elv);border-radius:99px;overflow:hidden;flex-shrink:0;border:1px solid var(--brd)}
.prog-fill{height:100%;width:0%;background:var(--acc);border-radius:99px;transition:width .25s ease}
.prog-pct{font-size:11px;font-weight:600;color:var(--t2);font-family:var(--mono);min-width:30px;text-align:right}

/* ── Controls ───────────────────────────────────────────────── */
.ctrl{border-bottom:1px solid var(--brd2);background:var(--sur)}
.ctrl-in{max-width:960px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Search */
.srch{position:relative;flex:1;min-width:160px}
.srch-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--t3);pointer-events:none}
.srch-inp{width:100%;padding:7px 26px 7px 30px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);color:var(--t1);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
.srch-inp::placeholder{color:var(--t3)}
.srch-inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.srch-clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);cursor:pointer;font-size:12px;padding:2px 4px;display:none;line-height:1}
.srch-clr:hover{color:var(--t1)}

/* Filter buttons */
.fgrp{display:flex;gap:4px;flex-wrap:wrap}
.fb{padding:5px 10px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--rs);color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap}
.fb:hover{border-color:var(--t3);color:var(--t1);background:var(--elv)}
.fb.on{background:var(--acc);border-color:var(--acc);color:#ffffff}
.fb[data-f="easy"].on{background:var(--e);border-color:var(--e)}
.fb[data-f="medium"].on{background:var(--m);border-color:var(--m)}
.fb[data-f="hard"].on{background:var(--h);border-color:var(--h)}

/* Action buttons */
.acts{display:flex;gap:6px;margin-left:auto}
.btn{padding:5px 12px;border-radius:var(--rs);border:1px solid var(--brd);background:var(--sur);color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--t3);color:var(--t1);background:var(--elv)}
.btn-r{color:var(--h);border-color:var(--hbo);background:var(--hb)}
.btn-r:hover{background:#fee2e2;border-color:var(--h);color:var(--h)}

/* ── Topic nav ──────────────────────────────────────────────── */
.tnav{overflow-x:auto;scrollbar-width:none;background:var(--sur)}
.tnav::-webkit-scrollbar{display:none}
.tnav-in{max-width:960px;margin:0 auto;padding:0 18px;display:flex}
.tl{padding:8px 13px;font-size:12px;font-weight:500;color:var(--t2);border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;cursor:pointer;text-decoration:none}
.tl:hover{color:var(--t1);border-bottom-color:var(--brd)}
.tl.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}

/* ── Main ───────────────────────────────────────────────────── */
.main{max-width:960px;margin:0 auto;padding:24px 18px 64px}

/* Results info */
.rinfo{display:none;font-size:12px;color:var(--t2);margin-bottom:16px;padding:6px 12px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--rs);box-shadow:var(--shd)}

/* ── Topic sections ─────────────────────────────────────────── */
.sec{margin-bottom:32px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--shd);overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--elv);border-bottom:1px solid var(--brd)}
.sec-name{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t1)}
.sec-cnt{font-size:11px;color:var(--t3);font-family:var(--mono)}
.sec-done{margin-left:auto;font-size:11px;font-weight:600;color:var(--t2);font-family:var(--mono);background:var(--sur);padding:2px 8px;border-radius:var(--rs);border:1px solid var(--brd)}
.sec-done.ok{color:var(--e);background:var(--eb);border-color:var(--ebo)}

/* ── Table ──────────────────────────────────────────────────── */
.qt{width:100%;border-collapse:collapse;table-layout:fixed}
.qt .cn{width:46px}.qt .cd{width:92px}.qt .cs{width:56px}

.qt thead th{padding:8px 12px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--brd);text-align:left;background:var(--sur)}
.qt thead th.cn{text-align:center}
.qt thead th.cs{text-align:center}

.qr{border-bottom:1px solid var(--brd2);transition:background .1s}
.qr:last-child{border-bottom:none}
.qr:hover{background:var(--elv)}
.qr td{padding:10px 12px;vertical-align:middle}

/* Number cell */
.cn{text-align:center;font-family:var(--mono);font-size:12px;color:var(--t3)}

/* Problem link */
.ql{color:var(--t1);font-size:13px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:color .12s}
.ql:hover{color:var(--lnkh)}
.ql:hover .eli{opacity:1}
.eli{opacity:0;color:var(--t3);flex-shrink:0;transition:opacity .12s}

/* Difficulty badge */
.db{display:inline-block;padding:2px 7px;border-radius:var(--rs);font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.de{color:var(--e);background:var(--eb);border-color:var(--ebo)}
.dm{color:var(--m);background:var(--mb);border-color:var(--mbo)}
.dh{color:var(--h);background:var(--hb);border-color:var(--hbo)}

/* Checkbox */
.cs{text-align:center}
.cb{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--t3);border-radius:4px;background:var(--sur);cursor:pointer;position:relative;vertical-align:middle;transition:all .12s;display:inline-block}
.cb:hover{border-color:var(--acc)}
.cb:checked{background:var(--acc);border-color:var(--acc)}
.cb:checked::after{content:'';position:absolute;left:4px;top:1.5px;width:5px;height:8px;border:2px solid #ffffff;border-top:none;border-left:none;transform:rotate(45deg)}

/* Done row */
.rd{background:var(--elv)}
.rd .ql{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t3)}
.rd .cn{opacity:.5}
.rd .db{opacity:.6}

/* ── Empty ──────────────────────────────────────────────────── */
.empty{display:none;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--t3);text-align:center;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--shd)}
.empty-ico{font-size:32px}
.empty p{font-size:14px;color:var(--t2)}

/* ── Footer ─────────────────────────────────────────────────── */
.foot{border-top:1px solid var(--brd);padding:24px 18px;text-align:center;font-size:13px;color:var(--t3);background:var(--sur)}

/* ── Responsive ─────────────────────────────────────────────── */
@media(max-width:640px){
  html{scroll-padding-top:210px}
  .hd-in{padding:10px 14px}
  .hd-r{align-items:flex-start;margin-left:0;width:100%}
  .chips{justify-content:flex-start}
  .prog{justify-content:flex-start}
  .prog-track{width:80px}
  .ctrl-in{padding:8px 14px}
  .acts{margin-left:0}
  .tnav-in{padding:0 14px}
  .main{padding:16px 14px 48px}
  .qt .cn,.qt thead th.cn{display:none}
  .qt .cd{width:76px}
  .ql{font-size:12.5px}
  .qr td{padding:9px 10px}
}
@media(max-width:400px){
  .fb{padding:4px 7px;font-size:11px}
  .chip{font-size:10.5px;padding:2px 6px}
}
</style>
</head>

// ────────────────────────────────────────────────────────────────────────────
// STATE & PERSISTENCE (localStorage using stable Question IDs)
// ────────────────────────────────────────────────────────────────────────────
const STORAGE_KEYS = ['dsa100_v3_done', 'dsa100_v2_done', 'dsa100_done'];
let done   = new Set();
let filt   = 'all';
let query  = '';

function load(){
  done = new Set();
  for(const key of STORAGE_KEYS){
    try{
      const raw = localStorage.getItem(key);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length > 0){
          parsed.forEach(id => done.add(Number(id)));
          break;
        }
      }
    } catch(_){}
  }
}

function save(){
  const arr = [...done];
  for(const key of STORAGE_KEYS){
    try{ localStorage.setItem(key, JSON.stringify(arr)); } catch(_){}
  }
}

// ────────────────────────────────────────────────────────────────────────────
// FILTER LOGIC
// ────────────────────────────────────────────────────────────────────────────
function getFiltered(){
  return P.filter(p=>{
    if(query){
      const q = query.toLowerCase();
      if(!p.title.toLowerCase().includes(q) &&
         !p.t.toLowerCase().includes(q) &&
         !p.d.toLowerCase().includes(q) &&
         !String(p.id).includes(q)) return false;
    }
    if(filt==='easy')    return p.d==='Easy';
    if(filt==='medium')  return p.d==='Medium';
    if(filt==='hard')    return p.d==='Hard';
    if(filt==='done')    return done.has(p.id);
    if(filt==='pending') return !done.has(p.id);
    return true;
  });
}

// ────────────────────────────────────────────────────────────────────────────
// HTML BUILDERS
// ────────────────────────────────────────────────────────────────────────────
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function extSvg(){
  return '<svg class="eli" width="10" height="10" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.604 1h4.146a.25.25 0 01.25.25v4.146a.25.25 0 01-.427.177L13.03 4.03 9.28 7.78a.75.75 0 01-1.06-1.06l3.75-3.75-1.543-1.543A.25.25 0 0110.604 1zM3.75 2A1.75 1.75 0 002 3.75v8.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0014 12.25v-3.5a.75.75 0 00-1.5 0v3.5a.25.25 0 01-.25.25h-8.5a.25.25 0 01-.25-.25v-8.5a.25.25 0 01.25-.25h3.5a.75.75 0 000-1.5h-3.5z"/></svg>';
}

function buildRow(p){
  const ok = done.has(p.id);
  const dc = p.d==='Easy'?'de':p.d==='Medium'?'dm':'dh';
  const n  = String(p.id).padStart(2,'0');
  return `<tr class="qr${ok?' rd':''}" data-id="${p.id}">
    <td class="cn">${n}</td>
    <td><a class="ql" href="${esc(p.u)}" target="_blank" rel="noopener noreferrer" title="Open on LeetCode">${esc(p.title)}${extSvg()}</a></td>
    <td class="cd"><span class="db ${dc}">${p.d}</span></td>
    <td class="cs"><input type="checkbox" class="cb" data-id="${p.id}"${ok?' checked':''} aria-label="${esc(p.title)}"></td>
  </tr>`;
}

function buildSection(topic, probs){
  const id   = TIDS[topic];
  const dc   = probs.filter(p=>done.has(p.id)).length;
  const ok   = dc===probs.length;
  return `<section class="sec" id="s-${id}">
    <div class="sec-hdr">
      <span class="sec-name">${esc(topic)}</span>
      <span class="sec-cnt">${probs.length} problems</span>
      <span class="sec-done${ok?' ok':''}" id="sd-${id}">${dc}/${probs.length} solved</span>
    </div>
    <table class="qt" role="table">
      <thead><tr>
        <th class="cn" scope="col">#</th>
        <th class="cp" scope="col">Problem</th>
        <th class="cd" scope="col">Difficulty</th>
        <th class="cs" scope="col">Done</th>
      </tr></thead>
      <tbody>${probs.map(buildRow).join('')}</tbody>
    </table>
  </section>`;
}

// ────────────────────────────────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────────────────────────────────
function render(){
  const f  = getFiltered();
  const qc = document.getElementById('qc');
  const es = document.getElementById('es');
  const ri = document.getElementById('ri');

  updProg();

  if(f.length===0){
    qc.innerHTML = '';
    es.style.display = 'flex';
    ri.style.display = 'none';
    return;
  }

  es.style.display = 'none';

  const isF = query || filt!=='all';
  if(isF){
    ri.style.display = 'block';
    ri.textContent = `Showing ${f.length} of 100 questions`;
  } else {
    ri.style.display = 'none';
  }

  const byT = {};
  TOPICS.forEach(t=>{ byT[t]=[]; });
  f.forEach(p=>{ if(byT[p.t]) byT[p.t].push(p); });

  let html = '';
  TOPICS.forEach(t=>{ if(byT[t].length>0) html+=buildSection(t,byT[t]); });
  qc.innerHTML = html;
}

// ────────────────────────────────────────────────────────────────────────────
// PROGRESS
// ────────────────────────────────────────────────────────────────────────────
function updProg(){
  const n   = done.size;
  const pct = Math.round(n);
  document.getElementById('sn').textContent = n;
  document.getElementById('pf').style.width = pct+'%';
  document.getElementById('pp').textContent = pct+'%';
}

function updSecDone(secId){
  const sec = document.getElementById('s-'+secId);
  if(!sec) return;
  const all = sec.querySelectorAll('.cb').length;
  const chk = sec.querySelectorAll('.cb:checked').length;
  const el  = document.getElementById('sd-'+secId);
  if(!el) return;
  el.textContent = chk+'/'+all+' solved';
  el.className   = 'sec-done'+(chk===all?' ok':'');
}

// ────────────────────────────────────────────────────────────────────────────
// CHECKBOX INTERACTION
// ────────────────────────────────────────────────────────────────────────────
document.getElementById('qc').addEventListener('change', function(e){
  const cb = e.target;
  if(!cb.classList.contains('cb')) return;
  const id  = Number(cb.dataset.id);
  const row = cb.closest('tr');
  if(cb.checked){ done.add(id);    row.classList.add('rd'); }
  else          { done.delete(id); row.classList.remove('rd'); }
  save();
  updProg();
  const sec = cb.closest('.sec');
  if(sec) updSecDone(sec.id.replace('s-',''));
});

// ────────────────────────────────────────────────────────────────────────────
// SEARCH
// ────────────────────────────────────────────────────────────────────────────
const SI = document.getElementById('si');
const SX = document.getElementById('sx');

SI.addEventListener('input', ()=>{
  query = SI.value.trim();
  SX.style.display = query ? 'block' : 'none';
  render();
});

SX.addEventListener('click', clrSrch);

function clrSrch(){
  SI.value = ''; query = '';
  SX.style.display = 'none';
  render();
}
window.clrSrch = clrSrch;

// ────────────────────────────────────────────────────────────────────────────
// FILTERS
// ────────────────────────────────────────────────────────────────────────────
document.getElementById('fg').addEventListener('click', function(e){
  const btn = e.target.closest('.fb');
  if(!btn) return;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  filt = btn.dataset.f;
  render();
});

// ────────────────────────────────────────────────────────────────────────────
// TOPIC NAVIGATION
// ────────────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tl').forEach(a=>{
  a.addEventListener('click', e=>{
    e.preventDefault();
    const id = a.dataset.id;
    SI.value = ''; query = '';
    SX.style.display = 'none';
    filt = 'all';
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
    document.querySelector('.fb[data-f="all"]').classList.add('on');
    render();
    requestAnimationFrame(()=>{
      const sec = document.getElementById('s-'+id);
      if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
});

let stmr;
window.addEventListener('scroll', ()=>{
  clearTimeout(stmr);
  stmr = setTimeout(()=>{
    const secs = document.querySelectorAll('.sec');
    let active = null;
    secs.forEach(s=>{
      if(s.getBoundingClientRect().top <= 200) active = s.id.replace('s-','');
    });
    document.querySelectorAll('.tl').forEach(a=>a.classList.remove('on'));
    if(active){
      const lnk = document.querySelector(`.tl[data-id="${active}"]`);
      if(lnk) lnk.classList.add('on');
    }
  }, 50);
},{passive:true});

// ────────────────────────────────────────────────────────────────────────────
// RESET
// ────────────────────────────────────────────────────────────────────────────
document.getElementById('rb').addEventListener('click', ()=>{
  if(!confirm('Reset all progress?\n\nThis will clear all 100 solved checkboxes.\nThis cannot be undone.')) return;
  done.clear();
  save();
  render();
});

// ────────────────────────────────────────────────────────────────────────────
// INITIAL BOOT
// ────────────────────────────────────────────────────────────────────────────
load();
render();
</script>
