<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f97316" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="#384252" stroke-width="12"/>
  
  <!-- Left Code Bracket < -->
  <path d="M 175 165 L 90 256 L 175 347" fill="none" stroke="url(#orangeGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Right Code Bracket > -->
  <path d="M 337 165 L 422 256 L 337 347" fill="none" stroke="url(#orangeGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Center Slash / -->
  <path d="M 288 145 L 224 367" fill="none" stroke="#f8fafc" stroke-width="36" stroke-linecap="round"/>
  
  <!-- Binary Node Indicator Glow Dot -->
  <circle cx="256" cy="100" r="16" fill="#f97316" filter="url(#glow)"/>
</svg>